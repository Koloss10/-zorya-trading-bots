name: Validate ZORYA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name, out in [("Zorya — торгові боти.html", "zorya"), ("orbix.html", "orbix")]:
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"{name}: expected exactly one inline script, found {len(scripts)}")
              Path(f"/tmp/{out}-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/zorya-inline.js
          node --check /tmp/orbix-inline.js
