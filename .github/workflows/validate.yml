name: Validate ZORYA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check HTML mirrors and extract JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = ["index.html", "Zorya — торгові боти.html"]
          contents = {name: Path(name).read_text(encoding="utf-8") for name in files}

          if contents[files[0]] != contents[files[1]]:
              raise SystemExit("HTML mirrors differ. Keep index.html and the named HTML file identical.")

          for index, name in enumerate(files):
              scripts = re.findall(r"<script>(.*?)</script>", contents[name], flags=re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"{name}: expected exactly one inline script, found {len(scripts)}")
              Path(f"/tmp/zorya-{index}.js").write_text(scripts[0], encoding="utf-8")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/zorya-0.js
          node --check /tmp/zorya-1.js
