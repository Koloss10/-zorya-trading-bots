name: Validate ZORYA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name, out in [("Zorya — торгові боти.html", "zorya"), ("orbix.html", "orbix")]:
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"{name}: no inline script found")
              # останній inline-скрипт — код застосунку (перед ним можуть бути вбудовані бібліотеки)
              Path(f"/tmp/{out}-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/zorya-inline.js
          node --check /tmp/orbix-inline.js
      - name: Check orbix.html is built from src/
        run: node tools/build.js --check
      - name: Run trading engine tests
        run: node --test tests/engine.test.js tests/exchange-sign.test.mjs tests/runner-core.test.mjs tests/mirror.test.mjs tests/sim.test.mjs
